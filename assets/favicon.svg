<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#10b981" rx="4"/>
  <g fill="white" font-family="Arial, sans-serif" font-weight="bold">
    <!-- Matrix brackets -->
    <text x="4" y="12" font-size="14">⎡</text>
    <text x="4" y="20" font-size="14">⎣</text>
    <text x="27" y="12" font-size="14">⎤</text>
    <text x="27" y="20" font-size="14">⎦</text>
    
    <!-- Matrix elements suggesting upper triangular form -->
    <circle cx="10" cy="10" r="1.5" fill="white"/>
    <circle cx="15" cy="10" r="1.5" fill="white"/>
    <circle cx="20" cy="10" r="1.5" fill="white"/>
    <circle cx="15" cy="18" r="1.5" fill="white"/>
    <circle cx="20" cy="18" r="1.5" fill="white"/>
  </g>
</svg>
