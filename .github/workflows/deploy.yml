name: Deploy to GitHub Pages

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          gleam-version: "1.14.0"
          rebar3-version: "3"

      - name: Install dependencies
        run: gleam deps download

      - name: Build for production
        run: gleam run -m lustre/dev build --minify --outdir=dist

      - name: Fix asset paths for GitHub Pages
        run: |
          sed -i 's|href="/gaussian.css"|href="./gaussian.css"|g' dist/index.html
          sed -i 's|src="/gaussian.js"|src="./gaussian.js"|g' dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
